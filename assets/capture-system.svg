<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
<title id="title">采集系统标注图</title><desc id="desc">解释设备如何佩戴，以及空间中的动捕系统测量什么。</desc>
<rect width="1200" height="560" fill="#ffffff"/>
<g font-family="Arial, PingFang SC, Microsoft YaHei, sans-serif">
<text x="35" y="35" font-size="12" letter-spacing="1.3" fill="#72829a">图示占位</text>
<text x="35" y="75" font-size="28" font-weight="500" fill="#2d3e54">采集系统标注图</text>
<text x="35" y="107" font-size="16" fill="#6c7889">解释设备如何佩戴，以及空间中的动捕系统测量什么。</text>
<rect x="35" y="136" width="550" height="330" fill="#ffffff" stroke="#b8c7da" stroke-dasharray="5 5"/>
<path d="M47 148L573 454M573 148L47 454" stroke="#e5ebf3" stroke-width="1"/>
<rect x="49" y="150" width="28" height="25" fill="#ffffff"/>
<text x="63" y="168" text-anchor="middle" font-size="12" fill="#647b9c">a</text>
<rect x="47" y="253.0" width="526" height="110" fill="#ffffff"/>
<text x="310.0" y="288.0" text-anchor="middle" fill="#354b68" font-size="23" font-weight="500">被试与可穿戴设备</text>
<text x="310.0" y="332.0" text-anchor="middle" fill="#667485" font-size="16" font-weight="400">标注 RoboCap、RoboWrist 与身体标记点</text>
<rect x="615" y="136" width="550" height="330" fill="#ffffff" stroke="#b8c7da" stroke-dasharray="5 5"/>
<path d="M627 148L1153 454M1153 148L627 454" stroke="#e5ebf3" stroke-width="1"/>
<rect x="629" y="150" width="28" height="25" fill="#ffffff"/>
<text x="643" y="168" text-anchor="middle" font-size="12" fill="#647b9c">b</text>
<rect x="627" y="253.0" width="526" height="110" fill="#ffffff"/>
<text x="890.0" y="288.0" text-anchor="middle" fill="#354b68" font-size="23" font-weight="500">采集空间与动捕系统</text>
<text x="890.0" y="332.0" text-anchor="middle" fill="#667485" font-size="16" font-weight="400">标注相机位置与观测区域；参数待确认</text>
<text x="35" y="529" font-size="13" fill="#8190a2"></text>
</g></svg>